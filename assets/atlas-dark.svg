<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="k3thrash architecture: llama.cpp K3 pid -> procio + tokensource -> thrash verdict -> trace.json + report">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="182" y1="180" x2="232" y2="180" marker-end="url(#ah-d)"/>
    <line x1="402" y1="180" x2="452" y2="180" marker-end="url(#ah-d)"/>
    <line x1="622" y1="180" x2="672" y2="180" marker-end="url(#ah-d)"/>
  </g>

  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="182" y1="180" x2="228" y2="180" stroke="#4DA3FF" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="402" y1="180" x2="448" y2="180" stroke="#8985FF" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="622" y1="180" x2="668" y2="180" stroke="#2DC79A" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <g>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M182,180 L228,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M402,180 L448,180" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M622,180 L668,180" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="20" y="138" width="160" height="84" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#4DA3FF">llama.cpp K3</text>
    <text x="100" y="194" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">running pid</text>

    <rect x="240" y="138" width="160" height="84" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="320" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#8985FF">procio + tokensource</text>
    <text x="320" y="194" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">/proc/io @10Hz + stderr</text>

    <rect x="460" y="138" width="160" height="84" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="540" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#8985FF">thrash verdict</text>
    <text x="540" y="194" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">reuse-ratio · topo kimi-k3</text>

    <rect x="680" y="138" width="160" height="84" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-0.5s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="760" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#2DC79A">trace.json + report</text>
    <text x="760" y="194" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">ASCII + sparkline</text>
  </g>

  <text x="440" y="300" text-anchor="middle" font-size="12" fill="#A1A1A8">two processes: your llama.cpp K3 pid + k3thrash CLI · no llama.cpp recompile</text>
  <text x="440" y="320" text-anchor="middle" font-size="11" fill="#A1A1A8">/proc/&lt;pid&gt;/io 10Hz · Δread_bytes / Δtokens · ≥ 2× reuse ⇒ pathological</text>
</svg>
