<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="k3thrash 架构：llama.cpp K3 pid -> procio + tokensource -> thrash verdict -> trace.json + report">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- static connectors (底层静线) -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="182" y1="180" x2="232" y2="180" marker-end="url(#ah-l)"/>
    <line x1="402" y1="180" x2="452" y2="180" marker-end="url(#ah-l)"/>
    <line x1="622" y1="180" x2="672" y2="180" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching-dash data flow (无限循环，方向 = 数据方向，向右) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="182" y1="180" x2="228" y2="180" stroke="#0071E3" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="402" y1="180" x2="448" y2="180" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="622" y1="180" x2="668" y2="180" stroke="#10A37F" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- packet dots flowing along each connector -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M182,180 L228,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M402,180 L448,180" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M622,180 L668,180" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes: 4 stages, breathing fill-opacity, staggered negative begin -->
  <g>
    <!-- 1. llama.cpp K3 (pid) — infra blue -->
    <rect x="20" y="138" width="160" height="84" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">llama.cpp K3</text>
    <text x="100" y="194" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">running pid</text>

    <!-- 2. procio + tokensource — agent purple -->
    <rect x="240" y="138" width="160" height="84" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="320" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">procio + tokensource</text>
    <text x="320" y="194" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">/proc/io @10Hz + stderr</text>

    <!-- 3. thrash verdict — agent purple (core primitive) -->
    <rect x="460" y="138" width="160" height="84" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="540" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">thrash verdict</text>
    <text x="540" y="194" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">reuse-ratio · topo kimi-k3</text>

    <!-- 4. trace.json + report — inference green -->
    <rect x="680" y="138" width="160" height="84" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.5s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="760" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">trace.json + report</text>
    <text x="760" y="194" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">ASCII + sparkline</text>
  </g>

  <!-- foot legend -->
  <text x="440" y="300" text-anchor="middle" font-size="12" fill="#6E6E73">两进程：用户 llama.cpp K3 pid + k3thrash CLI · 无需重编译 llama.cpp</text>
  <text x="440" y="320" text-anchor="middle" font-size="11" fill="#6E6E73">/proc/&lt;pid&gt;/io 10Hz · Δread_bytes / Δtokens · ≥ 2× reuse ⇒ pathological</text>
</svg>
